[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcheck"
version = "0.1.0"
description = "Audit AI agent transcripts for claims that no tool result supports"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Crow"}]
keywords = ["ai agents", "verification", "audit", "llm", "transcript", "overclaiming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[project.urls]
Homepage = "https://github.com/Crow0077/claimcheck"

[tool.setuptools.packages.find]
include = ["claimcheck*"]
